7" x="17" y="381.6529">&#8226; Apoyar log&#237;stica de</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="111.7832" x="23.9932" y="394.4576">reuniones y eventos</text></g><!--entity t2--><g class="entity" data-qualified-name="t2" data-source-line="31" id="ent0014"><rect fill="#E8F5E9" height="96.8281" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="160.3037" x="191.44" y="310.2238"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="120.2051" x="201.44" y="330.4342">&#8226; Preparar espacio en</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="121.9023" x="208.4332" y="343.2389">su hogar para el taller</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="140.3037" x="201.44" y="356.0436">&#8226; Acomodar sillas y mesa</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="119.2275" x="201.44" y="368.8483">&#8226; Ofrecer agua o caf&#233;</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="97.6787" x="201.44" y="381.6529">&#8226; Asegurar buena</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="63.3735" x="208.4332" y="394.4576">iluminaci&#243;n</text></g><!--entity t3--><g class="entity" data-qualified-name="t3" data-source-line="32" id="ent0015"><rect fill="#FFF8E1" height="96.8281" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="152.4458" x="386.37" y="310.2238"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="110.6821" x="396.37" y="330.4342">&#8226; Apoyar en talleres</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="95.3691" x="403.3632" y="343.2389">t&#233;cnicos (cr&#233;dito,</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="101.7769" x="403.3632" y="356.0436">inversi&#243;n, deudas)</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="127.9663" x="396.37" y="368.8483">&#8226; Asesorar familias con</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="125.4526" x="403.3632" y="381.6529">mayor endeudamiento</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="109.0225" x="396.37" y="394.4576">&#8226; Revisar contenido</text></g><!--entity t4--><g class="entity" data-qualified-name="t4" data-source-line="33" id="ent0016"><rect fill="#FFF8E1" height="96.8281" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="144.8135" x="574.18" y="310.2238"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="120.7529" x="584.18" y="330.4342">&#8226; Co-facilitar sesiones</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="112.0088" x="591.1732" y="343.2389">de empoderamiento</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="123.605" x="584.18" y="356.0436">&#8226; Compartir info sobre</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="112.2397" x="591.1732" y="368.8483">violencia econ&#243;mica</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="124.0186" x="584.18" y="381.6529">&#8226; Acompa&#241;ar apertura</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="117.8203" x="591.1732" y="394.4576">de cuentas bancarias</text></g><!--entity t5--><g class="entity" data-qualified-name="t5" data-source-line="34" id="ent0017"><rect fill="#E3F2FD" height="96.8281" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="141.9077" x="753.64" y="310.2238"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="121.9077" x="763.64" y="330.4342">&#8226; Coordinar reuniones</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="93.4893" x="770.6332" y="343.2389">trimestrales post</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="40.7075" x="770.6332" y="356.0436">mes 12</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="115.4624" x="763.64" y="368.8483">&#8226; Mantener grupo de</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="93.0166" x="770.6332" y="381.6529">WhatsApp activo</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="94.6172" x="763.64" y="394.4576">&#8226; Resolver dudas</text></g><!--entity f1--><g class="entity" data-qualified-name="f1" data-source-line="42" id="ent0023"><rect fill="#F5F5F5" height="45.6094" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="85.6079" x="38.79" y="473.4538"/><text fill="#000000" font-family="Arial" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="65.4307" x="48.79" y="493.6642">FASE 1 y 2</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="65.6079" x="48.79" y="506.4689">2-3 hrs/mes</text></g><!--entity f2--><g class="entity" data-qualified-name="f2" data-source-line="43" id="ent0024"><rect fill="#F5F5F5" height="45.6094" rx="7.5" ry="7.5" style="stroke:#181818;stroke-width:0.5;" width="113.4248" x="214.88" y="473.4538"/><text fill="#000000" font-family="Arial" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="42.9473" x="224.88" y="493.6642">FASE 2</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="93.4248" x="224.88" y="506.4689">3-4 hrs por turno</text></g><!--entity f3--